<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora MDI</title>
<style>
  /* Imita una ventana de Windows (tkinter) */
  body { background:#dcdcdc; margin:0; padding:20px; font:13px "Segoe UI", Tahoma, Arial, sans-serif; color:#000; }
  .ventana { max-width:620px; margin:0 auto; background:#f0f0f0; border:1px solid #9a9a9a; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .barra { display:flex; align-items:center; justify-content:space-between; background:#fff; height:32px; padding-left:10px; }
  .barra span { font-size:12px; }
  .barra .ctrl { display:flex; }
  .barra .ctrl i { width:46px; height:32px; display:flex; align-items:center; justify-content:center; font-style:normal; font-size:14px; }
  .contenido { padding:10px 12px 12px; }
  h1 { font-size:20px; margin:4px 0 6px; }
  table { border-collapse:collapse; margin-top:14px; }
  td { padding:3px 0; vertical-align:top; }
  td.et { width:200px; }
  #comH, #comM { width:28px; }
  input[type=text] { font:13px "Segoe UI", Arial, sans-serif; border:1px solid #7a7a7a; padding:2px 3px; background:#fff; }
  label { display:block; margin:0 0 6px; }
  small { color:#000; font-size:12px; }
  button { font:12px "Segoe UI", Arial, sans-serif; background:#f0f0f0; border:1px solid #adadad; padding:3px 6px; cursor:pointer; }
  button:hover { background:#e5f1fb; border-color:#0078d7; }
  button:active { background:#cce4f7; }
  textarea { display:block; width:100%; box-sizing:border-box; height:300px; margin:12px 0 8px; font:14px "Courier New", Courier, monospace;
             border:1px solid #828790; background:#fff; resize:vertical; padding:4px; }
  .espacio td { height:12px; }
  #cargando { color:#555; font-style:italic; }
</style>
</head>
<body>
<div class="ventana">
  <div class="barra"><span>🪶 Calculadora MDI</span><span class="ctrl"><i>—</i><i>☐</i><i>✕</i></span></div>
  <div class="contenido">
    <h1>Calculadora MDI</h1>
    Mínimo: 18 tareas/hora. Ideal: 20 tareas/hora.

    <table>
      <tr>
        <td class="et">Modo:</td>
        <td>
          <label><input type="radio" name="modo" value="ts" checked> Horas registradas (Timesheet)</label>
          <label><input type="radio" name="modo" value="pd"> Horas productivas directas</label>
        </td>
      </tr>
      <tr class="espacio"><td colspan="2"></td></tr>
      <tr>
        <td class="et">Frase:</td>
        <td><input type="text" id="frase" size="38"></td>
      </tr>
      <tr><td></td><td><small>(ej: Hice 142 tareas en 9 horas, comí 45 min)</small></td></tr>
      <tr class="espacio"><td colspan="2"></td></tr>
      <tr>
        <td class="et">Tareas:</td>
        <td><input type="text" id="tareas" size="8"></td>
      </tr>
      <tr>
        <td class="et" id="lblHoras">Horas registradas:</td>
        <td><input type="text" id="horas" size="8"></td>
      </tr>
      <tr id="filaComida">
        <td class="et">Comida:</td>
        <td>
          <input type="text" id="comH" size="2" value="1"> h
          <input type="text" id="comM" size="2" value="0"> min
          <button type="button" data-min="0">0</button><button type="button" data-min="30">30m</button><button type="button" data-min="45">45m</button><button type="button" data-min="60">1h</button><button type="button" data-min="75">1h15</button><button type="button" data-min="90">1h30</button>
        </td>
      </tr>
    </table>
    <br>
    <button type="button" id="btnCalcular">Calcular</button>
    <span id="cargando">Cargando Python…</span>

    <textarea id="resultado" readonly></textarea>
    <button type="button" id="copiarTodo">Copiar resultado</button><button type="button" id="copiarValor">Copiar valor</button>
    <span id="msg"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
// Los cálculos los hace productividad.py (el mismo archivo que usas en VS).
// Esta página solo carga Python en el navegador y le pasa los datos.
const $ = id => document.getElementById(id);
let py = null;        // funciones de productividad.py
let pyodide = null;

async function iniciar(){
  try {
    pyodide = await loadPyodide();
    const codigo = await (await fetch('productividad.py', {cache:'no-store'})).text();
    pyodide.FS.writeFile('productividad.py', codigo);
    pyodide.runPython('import sys; sys.path.insert(0, "."); import productividad');
    py = pyodide.pyimport('productividad');
    $('cargando').textContent = '';
    calcularYMostrar();
  } catch (e) {
    $('cargando').textContent = 'No se pudo cargar Python: ' + e.message;
  }
}

const modo = () => document.querySelector('input[name=modo]:checked').value;

function aNumero(s){
  if (!py) return null;
  const v = py.a_numero(s);
  return v === undefined ? null : v;
}

function ponerComida(min){
  $('comH').value = Math.floor(min / 60);
  $('comM').value = min % 60;
}

function mostrar(texto){ $('resultado').value = texto; }

function calcularYMostrar(){
  if (!py) return;
  const tareas = aNumero($('tareas').value);
  const horas = aNumero($('horas').value);
  if (tareas === null || horas === null){ mostrar('Faltan tareas u horas.'); return; }
  const h = aNumero($('comH').value || '0'), m = aNumero($('comM').value || '0');
  if (h === null || m === null){ mostrar('Tiempo de comida no válido.'); return; }
  try {
    mostrar(py.calcular(tareas, horas, modo(), h * 60 + m));
  } catch (e) {
    const linea = String(e.message).trim().split('\n').pop();
    mostrar('ERROR: ' + linea.replace(/^ValueError:\s*/, ''));
  }
}

function leerFrase(){
  if (!py) return;
  const d = py.leer_frase($('frase').value).toJs({dict_converter: Object.fromEntries});
  $('tareas').value = d.tareas ?? '';
  $('horas').value = d.horas ?? '';
  if (d.comida_min !== null && d.comida_min !== undefined) ponerComida(Math.round(d.comida_min));
  calcularYMostrar();
}

// Eventos
document.querySelectorAll('input[name=modo]').forEach(r => r.onchange = () => {
  const ts = modo() === 'ts';
  $('lblHoras').textContent = ts ? 'Horas registradas:' : 'Horas productivas:';
  $('filaComida').hidden = !ts;
  calcularYMostrar();
});
$('frase').addEventListener('input', leerFrase);
['tareas', 'horas', 'comH', 'comM'].forEach(id => $(id).addEventListener('input', calcularYMostrar));
document.querySelectorAll('button[data-min]').forEach(b => b.onclick = () => { ponerComida(+b.dataset.min); calcularYMostrar(); });
$('btnCalcular').onclick = calcularYMostrar;
document.addEventListener('keydown', e => { if (e.key === 'Enter') calcularYMostrar(); });

async function copiar(texto){
  try { await navigator.clipboard.writeText(texto); $('msg').textContent = ' ¡Copiado!'; }
  catch (e) { $('msg').textContent = ' No se pudo copiar'; }
  setTimeout(() => $('msg').textContent = '', 1400);
}
$('copiarTodo').onclick = () => copiar($('resultado').value.trim());
$('copiarValor').onclick = () => {
  const l = $('resultado').value.split('\n').find(x => x.startsWith('Valor para captura:'));
  if (l) copiar(l.split(': ')[1]);
};

$('tareas').focus();
iniciar();
</script>
</body>
</html>
